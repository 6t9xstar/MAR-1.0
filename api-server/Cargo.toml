[package]
name = "api-server"
version = "1.0.0"
edition = "2024"
description = "MAR 1.0 API server - high-performance Rust backend"

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws", "json"] }
tower = { version = "0.5", features = ["util", "steer", "buffer"] }
tower-http = { version = "0.6", features = [
    "cors", "trace", "compression-gzip", "compression-br",
    "limit", "catch-panic", "set-header", "request-id", "timeout",
    "auth", "validate-request", "fs",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tungstenite = "0.26"
hyper = { version = "1", features = ["full"] }
http = "1"
axum-extra = { version = "0.10", features = ["typed-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
serde_yaml = "0.9"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio", "postgres", "uuid", "chrono",
    "json", "migrate", "tls-rustls",
] }
deadpool-postgres = "0.14"
pgvector = { version = "0.4", features = ["sqlx"] }

# Cache
fred = "10.1.0"

# Search
meilisearch-sdk = "0.33"

# Vector DB
qdrant-client = "1.13"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v7", "serde", "fast-rng"] }
rand = "0.9"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "ansi", "registry"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics", "rt-tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", features = ["http-listener"] }

# Async
futures = "0.3"
tokio-stream = "0.1"

# Streaming
async-stream = "0.3"
async-trait = "0.1"

# Parsing
chrono = { version = "0.4", features = ["serde"] }
url = "2"
mime = "0.3"
mime_guess = "2"

# Error handling
thiserror = "2"
eyre = "0.6"

# Utils
derive_more = { version = "1", features = ["from", "into", "display", "constructor"] }
dotenvy = "0.15"
once_cell = "1"
dashmap = "6"
parking_lot = "0.12"
validator = { version = "0.19", features = ["derive"] }
regex = "1"
strum = { version = "0.27", features = ["derive"] }
humantime = "2"

# File processing
pdf-extract = "0.7"
calamine = "0.26"
docx-rs = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Math
meval = "0.2"

# NLP - unicode normalization for Urdu/Arabic text
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

# Knowledge ingestion
globset = "0.4"
ignore = "0.4"

[dev-dependencies]
tower-test = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
testcontainers = "0.23"
criterion = { version = "0.5", features = ["async_futures", "html_reports"] }
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
