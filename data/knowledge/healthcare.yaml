        content: |
          Common diseases: Hepatitis B/C (5-10% prevalence), Dengue (seasonal post-monsoon), Malaria (rural areas), Typhoid (including XDR strain), TB (5th highest burden), Diabetes (over 30M affected - 5th in world), Cardiovascular disease (leading cause of death). Prevention: vaccination, mosquito control, clean water, hygiene.
