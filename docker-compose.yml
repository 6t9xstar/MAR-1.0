version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mar
      POSTGRES_PASSWORD: mar
      POSTGRES_DB: mar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mar -d mar"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonflydata:/data
    deploy:
      resources:
        limits:
          memory: 1G

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1G

  meilisearch:
    image: getmeili/meilisearch
    environment:
      MEILI_MASTER_KEY: mar-search-key
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    deploy:
      resources:
        limits:
          memory: 512M

  api-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://mar:mar@postgres:5432/mar
      REDIS_URL: redis://dragonfly:6379
      QDRANT_URL: http://qdrant:6333
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: mar-search-key
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENVIRONMENT: production
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  inference:
    build:
      context: .
      dockerfile: deploy/Dockerfile.inference
    ports:
      - "8081:8081"
    environment:
      INFERENCE_MODEL_ID: ${INFERENCE_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      DEVICE: ${DEVICE:-cuda}
      RUST_LOG: info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  dragonflydata:
  qdrantdata:
  meilidata:
